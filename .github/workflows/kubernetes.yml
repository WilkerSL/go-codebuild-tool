name: Kubernetes

on:
  push:
    branches: [main]
    paths:
      - "internal/gen/kube.go"
      - "internal/gen/templates/kubernetes/**"
      - "internal/gen/templates/workspace/grpcx_*.tmpl"
      - "cmd/codebuild/kubernetes_test.go"
      - ".github/workflows/kubernetes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.29.0
      - name: Create the cluster
        run: kind create cluster --wait 120s
      - name: Deploy the generated manifests
        env:
          CODEBUILD_E2E_KUBERNETES: "1"
        run: go test -count=1 -timeout 40m -run TestKubernetesEndToEnd -v ./cmd/codebuild
