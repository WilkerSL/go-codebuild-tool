version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Conn).Close
        - os.Remove
        - (*encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
  exclusions:
    paths:
      - testdata
      - examples
      - example
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - misspell

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - testdata
      - examples
      - example
