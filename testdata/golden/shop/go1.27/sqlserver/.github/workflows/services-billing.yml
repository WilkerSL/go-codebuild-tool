name: services/billing

on:
  push:
    branches: [main]
    paths:
      - "services/billing/**"
      - "go.work"
      - "contracts/**"
      - ".github/workflows/services-billing.yml"
  pull_request:
    paths:
      - "services/billing/**"
      - "go.work"
      - "contracts/**"
      - ".github/workflows/services-billing.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --name sqlserver
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      GOWORK: "off"
      TEST_DATABASE_URL: sqlserver://sa:Test_Passw0rd@localhost:1433?database=app&encrypt=disable
    defaults:
      run:
        working-directory: services/billing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/billing/go.mod
          cache-dependency-path: services/billing/go.sum
      - name: Create the test database
        run: docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Passw0rd -C -Q "CREATE DATABASE app"
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Container image
        working-directory: .
        run: docker build -f services/billing/Dockerfile -t services-billing .
