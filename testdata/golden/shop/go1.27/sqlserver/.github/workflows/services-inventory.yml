name: services/inventory

on:
  push:
    branches: [main]
    paths:
      - "services/inventory/**"
      - "go.work"
      - "contracts/**"
      - "databases/shared/**"
      - ".github/workflows/services-inventory.yml"
  pull_request:
    paths:
      - "services/inventory/**"
      - "go.work"
      - "contracts/**"
      - "databases/shared/**"
      - ".github/workflows/services-inventory.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --name sqlserver
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      GOWORK: "off"
      TEST_DATABASE_URL: sqlserver://sa:Test_Passw0rd@localhost:1433?database=app&encrypt=disable
    defaults:
      run:
        working-directory: services/inventory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/inventory/go.mod
          cache-dependency-path: services/inventory/go.sum
      - name: Create the test database
        run: docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Passw0rd -C -Q "CREATE DATABASE app"
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Container image
        working-directory: .
        run: docker build -f services/inventory/Dockerfile -t services-inventory .
