apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - ../../base
images:
  - name: shop-billing
    newName: registry.example.com/shop-billing
    newTag: latest
  - name: shop-catalog
    newName: registry.example.com/shop-catalog
    newTag: latest
  - name: shop-gateway
    newName: registry.example.com/shop-gateway
    newTag: latest
  - name: shop-identity
    newName: registry.example.com/shop-identity
    newTag: latest
  - name: shop-inventory
    newName: registry.example.com/shop-inventory
    newTag: latest
  - name: shop-shared-migrate
    newName: registry.example.com/shop-shared-migrate
    newTag: latest
patches:
  - path: deployments.yaml
configMapGenerator:
  - name: billing-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
  - name: catalog-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
  - name: gateway-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
  - name: identity-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
  - name: inventory-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
