name: workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build every module
        run: go build example.com/shop/...
      - name: Generated code is up to date
        run: |
          if grep -q "go-codebuild-tool/cmd/codebuild" go.mod; then
            go tool codebuild plan --exit-code
          fi
      - name: Compose file
        run: docker compose config --quiet
