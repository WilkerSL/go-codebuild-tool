name: databases/shared

on:
  push:
    branches: [main]
    paths:
      - "databases/shared/**"
      - "go.work"
      - ".github/workflows/databases-shared.yml"
  pull_request:
    paths:
      - "databases/shared/**"
      - "go.work"
      - ".github/workflows/databases-shared.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: databases/shared
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: databases/shared/go.mod
          cache-dependency-path: databases/shared/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Container image
        working-directory: .
        run: docker build -f databases/shared/Dockerfile -t databases-shared .
