name: gateway

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "go.work"
      - "contracts/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "go.work"
      - "contracts/**"
      - ".github/workflows/gateway.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Container image
        working-directory: .
        run: docker build -f gateway/Dockerfile -t gateway .
