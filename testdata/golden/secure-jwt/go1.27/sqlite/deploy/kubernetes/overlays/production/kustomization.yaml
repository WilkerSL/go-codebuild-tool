apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: secure
resources:
  - ../../base
images:
  - name: secure-api
    newName: registry.example.com/secure-api
    newTag: latest
patches:
  - path: deployments.yaml
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
