apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: secure
resources:
  - ../../base
components:
  - ../../components/observability
images:
  - name: secure-api
    newName: registry.example.com/secure-api
    newTag: latest
patches:
  - path: deployments.yaml
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OPS_JAEGER_URL=http://jaeger:16686
