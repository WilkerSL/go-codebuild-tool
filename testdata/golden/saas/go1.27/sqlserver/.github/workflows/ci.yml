name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --name sqlserver
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: sqlserver://sa:Test_Passw0rd@localhost:1433?database=app&encrypt=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Create the test database
        run: docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Passw0rd -C -Q "CREATE DATABASE app"
      - name: Verify modules
        run: go mod verify
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Generated code is up to date
        run: |
          if grep -q "go-codebuild-tool/cmd/codebuild" go.mod; then
            go tool codebuild plan --exit-code
          fi
      - name: Container image
        run: docker build -t app .
