name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Generated code is up to date
        run: |
          if grep -q "go-codebuild-tool/cmd/codebuild" go.mod; then
            go tool codebuild plan --exit-code
          fi
      - name: Container image
        run: docker build -t app .
