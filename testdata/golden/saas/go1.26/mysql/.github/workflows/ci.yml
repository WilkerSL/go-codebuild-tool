name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: app:app@tcp(localhost:3306)/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Generated code is up to date
        run: |
          if grep -q "go-codebuild-tool/cmd/codebuild" go.mod; then
            go tool codebuild plan --exit-code
          fi
      - name: Container image
        run: docker build -t app .
